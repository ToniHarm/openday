<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Home — Tamagotchi Plaza</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐣</text></svg>">
<link rel="stylesheet" href="css/pet-tokens.css">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font-shell);
    color: var(--ink);
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============================================================
     SHELL CHROME — always visible, never toggled by game state
     ============================================================ */

  #shell {
    position: relative;
    width: min(94vw, 480px);
    height: min(94vh, 780px);
    --frame-bg: linear-gradient(160deg, var(--shell-pink), var(--shell-lavender) 55%, var(--shell-blue));
    --frame-pattern: none;
    --frame-bezel: var(--ink);
    --frame-button: var(--accent);
    --frame-title: var(--ink);
    background: var(--frame-bg);
    border-radius: 46% 46% 40% 40% / 30% 30% 24% 24%;
    box-shadow: 10px 10px 0 rgba(74,46,85,0.28), 0 0 0 6px rgba(255,255,255,0.35) inset;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 20px 18px;
    isolation: isolate;
    transition: background 180ms ease, box-shadow 180ms ease;
  }

  #shell::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: var(--frame-pattern);
    opacity: 0.72;
    pointer-events: none;
  }

  #shell[data-frame="red-flower"] { --frame-bg: linear-gradient(155deg,#92f4ba 0 18%,#ff5161 48%,#e93434); --frame-pattern: radial-gradient(circle at 78% 13%,#fff 0 9px,#ffe24e 10px 13px,transparent 14px),radial-gradient(circle at 20% 72%,rgba(255,255,255,.22) 0 5px,transparent 6px); --frame-bezel:#ff7eb4; --frame-button:#ff56a7; --frame-title:#fff; }
  #shell[data-frame="blue-angel"] { --frame-bg: linear-gradient(145deg,#c9f4ff,#6bb9ef 42%,#3677bd); --frame-pattern: radial-gradient(circle at 16% 27%,rgba(255,255,255,.8) 0 12px,transparent 13px),radial-gradient(circle at 84% 27%,rgba(255,255,255,.8) 0 12px,transparent 13px),radial-gradient(circle,rgba(255,255,255,.35) 1.5px,transparent 2px); --frame-bezel:#a8dcf8; --frame-button:#eafaff; --frame-title:#fff4a3; }
  #shell[data-frame="pink-sprinkle"] { --frame-bg: linear-gradient(150deg,#ffc4df,#f19bbf); --frame-pattern: repeating-linear-gradient(35deg,transparent 0 34px,#f7d33d 35px 39px,transparent 40px 57px,#16a6a0 58px 62px,transparent 63px 81px,#d82f67 82px 86px); --frame-bezel:#f6dc72; --frame-button:#8d543e; --frame-title:#b60f4a; }
  #shell[data-frame="pastel-angel"] { --frame-bg: linear-gradient(150deg,#fffbd4,#d8fff2 40%,#f3c7ff 76%,#fff1c4); --frame-pattern: radial-gradient(circle at 15% 40%,rgba(255,255,255,.9) 0 14px,transparent 15px),linear-gradient(45deg,transparent 45%,rgba(92,211,255,.65) 47% 53%,transparent 55%); --frame-bezel:#9b7dd2; --frame-button:#d795c9; --frame-title:#fff; }
  #shell[data-frame="pink-hearts"] { --frame-bg: linear-gradient(145deg,#ffb4d0,#f578ab); --frame-pattern: radial-gradient(circle at 20% 20%,#dd356f 0 7px,transparent 8px),radial-gradient(circle at 75% 36%,#dd356f 0 9px,transparent 10px),radial-gradient(circle at 34% 77%,#dd356f 0 8px,transparent 9px); --frame-bezel:#d84f83; --frame-button:#fff; --frame-title:#fff; }
  #shell[data-frame="white-angel"] { --frame-bg: linear-gradient(145deg,#fff,#e4edf5 65%,#cad7e6); --frame-pattern: radial-gradient(circle at 12% 30%,rgba(255,255,255,.85) 0 12px,transparent 13px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.85) 0 12px,transparent 13px); --frame-bezel:#d9e5ee; --frame-button:#fffbe3; --frame-title:#27364a; }
  #shell[data-frame="teal-party"] { --frame-bg: linear-gradient(150deg,#13a8bd,#05778f); --frame-pattern: radial-gradient(circle at 18% 19%,#ffda4e 0 5px,transparent 6px),radial-gradient(circle at 80% 25%,#ff649c 0 6px,transparent 7px),radial-gradient(circle at 25% 80%,#51e5b0 0 7px,transparent 8px),radial-gradient(circle at 75% 78%,#ff784d 0 5px,transparent 6px); --frame-bezel:#f49ab7; --frame-button:#ff81af; --frame-title:#fff; }
  #shell[data-frame="midnight-stars"] { --frame-bg: linear-gradient(145deg,#1348bd,#071d72 68%,#050d3b); --frame-pattern: radial-gradient(circle at 18% 18%,#fff5a5 0 2px,transparent 3px),radial-gradient(circle at 79% 26%,#f3cf3d 0 3px,transparent 4px),radial-gradient(circle at 30% 75%,#fff 0 2px,transparent 3px),linear-gradient(25deg,transparent 45%,rgba(255,213,50,.35) 47% 49%,transparent 51%); --frame-bezel:#e5b939; --frame-button:#eaf6ff; --frame-title:#fff09b; }
  #shell[data-frame="family-doodle"] { --frame-bg: linear-gradient(145deg,#f8b5d5,#f18bbb); --frame-pattern: linear-gradient(35deg,transparent 0 31%,rgba(255,255,255,.5) 32% 34%,transparent 35% 66%,rgba(116,195,255,.45) 67% 69%,transparent 70%),radial-gradient(circle at 20% 28%,#ffe55a 0 4px,transparent 5px),radial-gradient(circle at 77% 70%,#62d7e8 0 4px,transparent 5px); --frame-bezel:#ffd5e8; --frame-button:#ffdb36; --frame-title:#fff; }
  #shell[data-frame="pearl-angel"] { --frame-bg: linear-gradient(145deg,#fffdf4,#e8e2d2 58%,#c8c2b5); --frame-pattern: radial-gradient(circle at 50% 12%,rgba(255,255,255,.9) 0 9px,transparent 10px),linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 43% 48%,transparent 51%); --frame-bezel:#eae2cf; --frame-button:#fffced; --frame-title:#283344; }
  #shell[data-frame="pink-crystal"] { --frame-bg: linear-gradient(145deg,rgba(255,235,248,.92),rgba(255,130,202,.72) 52%,rgba(229,78,164,.8)); --frame-pattern: linear-gradient(45deg,rgba(255,255,255,.3) 25%,transparent 25% 75%,rgba(255,255,255,.3) 75%),linear-gradient(-45deg,transparent 42%,rgba(255,255,255,.22) 43% 48%,transparent 49%); --frame-bezel:#ffc1e5; --frame-button:#ff80c5; --frame-title:#fff; }
  #shell[data-frame="blue-flower"] { --frame-bg: linear-gradient(145deg,#d9faff,#79d9ef 46%,#40aed1); --frame-pattern: radial-gradient(circle at 17% 21%,#ff784c 0 4px,#fff 5px 8px,transparent 9px),radial-gradient(circle at 82% 34%,#ffe34e 0 4px,#fff 5px 8px,transparent 9px),linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25% 50%,rgba(255,255,255,.28) 50% 75%,transparent 75%); --frame-bezel:#86d9f2; --frame-button:#55c7e8; --frame-title:#047daf; }

  .shell-nameplate {
    font-family: var(--font-shell);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: var(--frame-title);
    text-align: center;
    margin-bottom: 12px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.6);
  }

  #lcd-screen {
    position: relative;
    flex: 0 1 570px;
    min-height: 0;
    width: min(78%, 360px);
    background: var(--screen-bg);
    border-radius: 18px;
    box-shadow: 0 0 0 8px var(--frame-bezel), inset 0 0 14px rgba(74,46,85,0.25);
    overflow: hidden;
  }

  .abc-buttons {
    display: flex;
    gap: 22px;
    margin-top: 16px;
  }

  .abc-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--frame-button);
    box-shadow: 0 4px 0 rgba(74,46,85,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-shell);
    font-weight: 700;
    font-size: 0.75rem;
    color: white;
  }

  /* ============================================================
     IN-SCREEN CONTENT — everything below lives inside the LCD
     ============================================================ */

  .screen {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    font-family: var(--font-screen);
    color: var(--px-outline);
  }

  .screen.active { display: flex; }

  .px-title {
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--px-outline);
    margin: 0 0 14px;
  }

  .px-body {
    font-size: 0.55rem;
    line-height: 1.9;
    margin-bottom: 18px;
  }

  .px-btn {
    font-family: var(--font-screen);
    font-size: 0.6rem;
    padding: 12px 18px;
    min-height: 44px;
    min-width: 44px;
    border-radius: 10px;
    border: 3px solid var(--px-outline);
    background: var(--px-gold);
    color: var(--px-outline);
    cursor: pointer;
    touch-action: manipulation;
  }

  .px-btn:active { transform: translateY(2px); }

  .px-btn-ghost {
    background: var(--screen-bg);
  }

  .px-small {
    font-size: 0.45rem;
    line-height: 1.7;
    margin-top: 14px;
    color: var(--px-outline);
    opacity: 0.75;
  }

  .px-btn:focus-visible, input:focus-visible {
    outline: 3px solid var(--px-purple);
    outline-offset: 2px;
  }

  /* ---------- egg / hatching (first-ever visit for this pet only) ---------- */

  .egg-canvas-wrap { margin-bottom: 10px; }

  .hatching-panel .egg-canvas-wrap {
    animation: eggShake 0.16s linear infinite;
  }

  .hatching-panel .egg-canvas-wrap.egg-flash {
    animation: eggFlash 0.3s ease-out forwards;
  }

  @keyframes eggShake {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  @keyframes eggFlash {
    0% { transform: scale(1); }
    60% { transform: scale(1.3); filter: brightness(1.7); }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* ---------- play screen ---------- */

  #screen-play { justify-content: flex-start; padding-top: 8px; }

  .play-hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 0.4rem;
    margin-bottom: 4px;
  }

  .hud-corner {
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-align: left;
  }

  .hud-corner.right { text-align: right; align-items: flex-end; }

  .mute-btn, .plaza-btn {
    font-size: 0.9rem;
    min-width: 44px;
    min-height: 44px;
    border-radius: 10px;
    border: 2px solid var(--px-outline);
    background: var(--screen-bg);
    cursor: pointer;
    touch-action: manipulation;
    margin-top: 4px;
  }

  .plaza-btn { font-size: 0.55rem; padding: 0 8px; }

  .meters {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 4px;
  }

  .meter-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .meter-label { font-size: 0.4rem; width: 34px; text-align: left; }

  .pips { display: flex; gap: 2px; }

  .pet-stage-area {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
  }

  #pet-canvas-wrap {
    position: relative;
    width: 160px;
    height: 160px;
    touch-action: none;
    user-select: none;
    animation: petBob 3.2s ease-in-out infinite;
  }

  /* two canvases stacked at the same rect — only one is ever shown, decided
     once at page init (see the isUsing3D flag below); a canvas can only ever
     be bound to one context type for its lifetime, so this project never
     tries to switch a single canvas between 2D and WebGL mid-session */
  #pet-canvas-2d, #pet-canvas-3d {
    position: absolute;
    inset: 0;
  }

  @keyframes petBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .call-flash {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
  }

  .call-flash.show {
    animation: callBlink 0.4s steps(2) infinite;
  }

  @keyframes callBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .combo-pop, .approve-pop {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    font-family: var(--font-screen);
    font-size: 0.55rem;
    color: var(--px-outline);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }

  .combo-pop.show, .approve-pop.show {
    animation: popUp 0.8s ease forwards;
  }

  @keyframes popUp {
    0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(0.6); }
    25% { opacity: 1; transform: translateX(-50%) translateY(-16px) scale(1.1); }
    70% { opacity: 1; transform: translateX(-50%) translateY(-24px) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-34px) scale(1); }
  }

  .food-item, .sponge-item {
    position: absolute;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    cursor: grab;
    z-index: 5;
    transition: left 0.25s ease, top 0.25s ease;
  }

  .food-item.dragging, .sponge-item.dragging { transition: none; cursor: grabbing; }
  .food-item.eaten, .sponge-item.cleaned { opacity: 0; transform: scale(0.3); }

  .night-dim {
    position: absolute;
    inset: 0;
    background: rgba(20, 10, 40, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-screen);
    font-size: 0.55rem;
    color: var(--px-white);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }

  .night-dim.show { opacity: 1; }

  .bedtime-prompt {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.4rem;
    background: var(--px-outline);
    color: var(--px-white);
    padding: 4px 8px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    z-index: 15;
  }

  .bedtime-prompt.show { opacity: 1; animation: callBlink 0.9s steps(2) infinite; }

  #pet-canvas-2d, #pet-canvas-3d { transform-origin: 50% 85%; }

  @keyframes petSquish {
    0% { transform: scale(1, 1); }
    30% { transform: scale(1.15, 0.85); }
    60% { transform: scale(0.9, 1.08); }
    100% { transform: scale(1, 1); }
  }

  #pet-canvas-2d.pet-squish, #pet-canvas-3d.pet-squish { animation: petSquish 320ms ease; }

  .milestone-pop {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    font-family: var(--font-screen);
    font-size: 0.55rem;
    text-align: center;
    line-height: 1.8;
    color: var(--px-outline);
    background: var(--cream);
    border: 3px solid var(--px-outline);
    border-radius: 12px;
    padding: 10px 14px;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    white-space: nowrap;
  }

  .milestone-pop.show { animation: milestonePop 2.4s ease forwards; }

  @keyframes milestonePop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    25% { transform: translate(-50%, -50%) scale(1); }
    85% { opacity: 1; }
    100% { opacity: 0; }
  }

  .points-flash {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    font-family: var(--font-screen);
    font-size: 0.5rem;
    color: var(--px-outline);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }

  .points-flash.show { animation: popUp 0.9s ease forwards; }

  /* small tappable pill, bottom-pinned — must NOT block the interaction's own
     gesture (e.g. still-feedable food) while it's showing */
  .beat-continue {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 46;
    background: var(--px-outline);
    color: var(--px-white);
    font-size: 0.4rem;
    padding: 7px 14px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    white-space: nowrap;
  }

  .handtrack-toggle {
    margin-top: 10px;
    font-size: 0.45rem;
    padding: 8px 12px;
    min-height: 38px;
    max-width: 90%;
    white-space: normal;
    line-height: 1.5;
  }

  .handtrack-preview {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 56px;
    height: 42px;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid var(--px-outline);
    background: #000;
    z-index: 30;
    cursor: pointer;
    touch-action: manipulation;
  }

  .handtrack-preview video,
  .handtrack-preview canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    object-fit: cover;
  }

  .handtrack-label {
    position: absolute;
    bottom: 1px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--font-screen);
    font-size: 0.3rem;
    color: var(--px-white);
    background: rgba(74,46,85,0.6);
    line-height: 1.4;
    pointer-events: none;
    min-height: 0.5em;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
  }

  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

  @media (min-width: 900px) and (min-height: 800px) {
    #shell {
      width: min(90vw, 560px);
      height: min(92vh, 860px);
      padding: 30px 26px 22px;
    }

    #lcd-screen {
      width: min(80%, 420px);
      flex-basis: 640px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<div id="shell">
  <div class="shell-nameplate">✧ Home ✧</div>

  <div id="lcd-screen">

    <section class="screen" data-screen="hatching" id="screen-hatching">
      <div class="hatching-panel" id="hatching-crack-view">
        <div class="egg-canvas-wrap"><canvas id="egg-canvas-hatch" width="110" height="110"></canvas></div>
        <p class="px-title" style="margin-top:10px;">hatching...</p>
      </div>
    </section>

    <section class="screen" data-screen="play" id="screen-play">
      <div class="play-hud">
        <div class="hud-corner">
          <span id="discipline-tag">DISC 0</span>
          <span id="weight-tag">WEIGHT: healthy</span>
        </div>
        <div class="hud-corner right">
          <span id="points-tag">0 PTS</span>
          <div style="display:flex; gap:4px;">
            <button class="mute-btn" id="mute-btn" aria-label="Mute sound" aria-pressed="false">S</button>
            <button class="plaza-btn" id="plaza-btn" aria-label="Return to Plaza" title="Return to Plaza">🏙️</button>
          </div>
        </div>
      </div>

      <p class="pet-name-label" id="pet-name-label" style="font-size:0.42rem; text-align:center; margin:0 0 4px; opacity:0.8;"></p>

      <div class="meters">
        <div class="meter-row">
          <span class="meter-label">HUNGER</span>
          <div class="pips" id="pips-hunger"></div>
        </div>
        <div class="meter-row">
          <span class="meter-label">HAPPY</span>
          <div class="pips" id="pips-happy"></div>
        </div>
      </div>

      <div class="pet-stage-area" id="pet-stage-area">
        <div id="pet-canvas-wrap">
          <canvas id="pet-canvas-2d" width="160" height="160"></canvas>
          <canvas id="pet-canvas-3d" width="160" height="160" style="display:none;"></canvas>
          <div class="call-flash" id="call-flash">!</div>
          <div class="combo-pop" id="combo-pop">COMBO!</div>
          <div class="approve-pop" id="approve-pop">+DISC</div>
          <div class="points-flash" id="points-flash">+0 PTS</div>
        </div>

        <div class="food-item" id="food-item" aria-label="Food item, drag onto the pet's mouth" role="img">
          <canvas id="food-canvas" width="32" height="32"></canvas>
        </div>

        <div class="sponge-item" id="sponge-item" aria-label="Sponge, drag onto the pet to clean it" role="img" style="display:none;">
          <canvas id="sponge-canvas" width="32" height="32"></canvas>
        </div>

        <div class="bedtime-prompt" id="bedtime-prompt">HOLD TO SLEEP</div>
        <div class="night-dim" id="night-dim">zzz...</div>

        <div class="beat-continue" id="beat-continue" style="display:none;">
          <p class="beat-continue-text" id="beat-continue-text">TAP TO CONTINUE</p>
        </div>

        <div class="milestone-pop" id="milestone-pop">GREW UP!</div>

        <button class="px-btn px-btn-ghost handtrack-toggle" id="handtrack-btn" type="button" style="position:absolute; bottom:6px; right:6px; font-size:0.35rem; padding:6px 8px; min-height:0; margin-top:0;">🖐 HAND TRACKING</button>
        <p class="px-small" id="handtrack-status" style="position:absolute; bottom:-2px; left:0; right:0; font-size:0.3rem; margin:0; text-align:center;"></p>

        <div class="handtrack-preview" id="handtrack-preview" style="display:none;" title="Tap to stop hand tracking">
          <video id="handtrack-video" muted playsinline autoplay></video>
          <canvas id="handtrack-overlay" width="120" height="90"></canvas>
          <span class="handtrack-label" id="handtrack-label"></span>
        </div>
      </div>
    </section>

  </div>

  <div class="abc-buttons" aria-hidden="true">
    <div class="abc-btn">A</div>
    <div class="abc-btn">B</div>
    <div class="abc-btn">C</div>
  </div>
</div>

<script src="js/pet-save.js"></script>
<script src="js/vendor/howler.min.js"></script>
<script src="js/pet-audio.js"></script>
<script src="js/pet-render.js"></script>
<script src="js/vendor/three.min.js"></script>
<script src="js/pet-render-3d.js"></script>
<script>
(function () {
  "use strict";

  // ============================================================
  // ACTIVE PET — this page never runs without a save loaded via the Plaza
  // ============================================================

  var activeKey = sessionStorage.getItem("active-pet-key");
  var record = activeKey ? PetSave.load(activeKey) : null;
  if (!record) {
    location.href = "index.html";
    return;
  }

  // ============================================================
  // CONSTANTS
  // ============================================================

  var HOLD_THRESHOLD_MS = 200;
  var TAP_HAPPY_DELTA = 4;
  var COMBO_WINDOW_MS = 1000;
  var COMBO_TAP_COUNT = 3;
  var COMBO_HAPPY_BONUS = 2;

  var MEAL_HUNGER = 18, MEAL_HAPPY = 2;
  var SNACK_HUNGER = 10, SNACK_HAPPY = 6, SNACK_WEIGHT = 8;
  var FOOD_RESPAWN_MS = 400;

  var CALL_WINDOW_MS = 5000;
  var DISCIPLINE_GAIN = 6;

  var POOP_UNCLEANED_HAPPY_THRESHOLD_MS = 15000;
  var POOP_HAPPY_DRAIN_PER_SEC = 1;

  // visit-count thresholds driving growth stage — a first-pass tuning
  // constant, same as the rest of this game's numbers, pending playtesting
  var STAGE_CHILD_AT_VISITS = 4;
  var STAGE_FORM_AT_VISITS = 10;

  // the fixed sequence of interactions Home cycles through, repeatedly and
  // indefinitely — there is no terminal "reveal" any more, since the pet now
  // persists across the whole event instead of ending a single timed run
  var INTERACTION_SEQUENCE = ["feed", "clean", "attention", "bedtime"];
  var INTERACTION_LABELS = {
    feed: "FEED TIME", clean: "CLEAN UP", attention: "ATTENTION!", bedtime: "BEDTIME",
  };

  var FRAME_THEMES = [
    { id: "red-flower" }, { id: "blue-angel" }, { id: "pink-sprinkle" }, { id: "pastel-angel" },
    { id: "pink-hearts" }, { id: "white-angel" }, { id: "teal-party" }, { id: "midnight-stars" },
    { id: "family-doodle" }, { id: "pearl-angel" }, { id: "pink-crystal" }, { id: "blue-flower" },
  ];

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function jitter(min, max) { return min + Math.random() * (max - min); }

  // ============================================================
  // STATE — persistent fields mirror `record`; the rest is page-local
  // interaction/UI bookkeeping that never needs to survive a navigation
  // ============================================================

  var state = {
    stats: record.stats,
    growthStage: record.appearance.growthStage,
    form: record.appearance.form,
    petColor: record.appearance.petColor,
    frameId: record.appearance.frameId,
    petName: record.identity.name,
    poopPresent: false,
    poopSpawnedAt: null,
    foodSlot: { type: null },
    beat: null,
    events: {
      callActive: false, callDeadline: null,
      bedtimeActive: false, bedtimeHandled: false, bedtimeDeadline: null,
    },
    input: { pressStart: null, holding: false, tapTimestamps: [], draggingItemId: null },
  };

  // persists the page-local mirror of the save's stats/appearance back into
  // the shared record — points/visits/care/form themselves are only ever
  // changed through PetSave.awardPoints (see completeInteraction)
  function persist() {
    record.stats = state.stats;
    record.appearance.growthStage = state.growthStage;
    record.appearance.petColor = state.petColor;
    record.appearance.frameId = state.frameId;
    PetSave.save(record);
  }

  // ============================================================
  // HUD ICON SPRITES (food/sponge/heart meters — page-local, not the pet body)
  // ============================================================

  var T = null;
  var ICON_GRIDS = {
    meal: {
      palette: { ".": T, O: "#4A2E55", W: "#F7F1D0", G: "#65C466", R: "#FF8B4D", B: "#D85A8B" },
      rows: [
        "..OOOO..",
        ".OWWWWO.",
        "OWGWGWRO",
        "OWRWRGWO",
        "OOOOOOOO",
        ".OBBBBO.",
        "..OBBO..",
        "........",
      ],
    },
    snack: {
      palette: { ".": T, O: "#4A2E55", P: "#FF8FC7", M: "#D85A8B", R: "#E64B55", G: "#65C466", W: "#FFFFFF" },
      rows: [
        "...R....",
        "..OGO...",
        ".OPPPPO.",
        "OPWPPWPO",
        "OPPPPPPO",
        ".OMMMMO.",
        ".OMMMMO.",
        "..OOOO..",
      ],
    },
    sponge: {
      palette: { ".": T, O: "#4A2E55", S: "#FFCB3D", B: "#B98AFF" },
      rows: [
        "........",
        ".OOOOOO.",
        "OSSSSSSO",
        "OSBSBSBO",
        "OSSSSSSO",
        "OSBSBSBO",
        "OSSSSSSO",
        ".OOOOOO.",
      ],
    },
    heartFilled: {
      palette: { ".": T, O: "#4A2E55", G: "#FF6FB5" },
      rows: [
        ".OO.OO..",
        "OGGOGGO.",
        "OGGGGGO.",
        "OGGGGGO.",
        ".OGGGO..",
        "..OGO...",
        "...O....",
      ],
    },
    heartEmpty: {
      palette: { ".": T, O: "#4A2E55" },
      rows: [
        ".OO.OO..",
        "O..O..O.",
        "O.....O.",
        "O.....O.",
        "..O.O...",
        "...O....",
        "........",
      ],
    },
  };

  function drawIcon(canvas, key) {
    var spec = ICON_GRIDS[key];
    var ctx = PetRender.clearCanvas(canvas);
    var cols = Math.max.apply(null, spec.rows.map(function (row) { return row.length; }));
    var px = Math.floor(Math.min(canvas.width / cols, canvas.height / spec.rows.length));
    var gridW = cols * px;
    var gridH = spec.rows.length * px;
    var ox = Math.floor((canvas.width - gridW) / 2);
    var oy = Math.floor((canvas.height - gridH) / 2);
    PetRender.drawGrid(ctx, spec.rows, spec.palette, ox, oy, px);
  }

  // ============================================================
  // PET EXPRESSION / RENDERING
  // ============================================================

  // decide ONCE whether this session renders the pet in 3D — a canvas can
  // only ever be bound to one context type for its lifetime, so this is not
  // re-evaluated later; a webglcontextlost event (GPU dropping the context
  // mid-session, a different failure mode than load-time unavailability)
  // still falls back to the 2D canvas below
  var petCanvas2D = document.getElementById("pet-canvas-2d");
  var petCanvas3D = document.getElementById("pet-canvas-3d");
  var use3D = typeof PetRender3D !== "undefined" && PetRender3D.isAvailable();
  var petCanvas = use3D ? petCanvas3D : petCanvas2D;
  if (use3D) {
    petCanvas3D.style.display = "";
    petCanvas2D.style.display = "none";
    petCanvas3D.addEventListener("webglcontextlost", function () {
      use3D = false;
      petCanvas = petCanvas2D;
      petCanvas3D.style.display = "none";
      petCanvas2D.style.display = "";
      renderPet();
    });
  }
  var petExpression = "normal";
  var isBlinking = false;

  function scheduleBlink() {
    setTimeout(function () {
      isBlinking = true;
      setTimeout(function () { isBlinking = false; }, 140);
      scheduleBlink();
    }, jitter(2500, 5500));
  }
  scheduleBlink();

  // precedence: an active gesture state (pressed/sleepy) > the uncleaned-poop
  // squint > an idle blink > normal
  function currentExpression() {
    if (petExpression !== "normal") return petExpression;
    if (state.poopPresent && (performance.now() - state.poopSpawnedAt) >= POOP_UNCLEANED_HAPPY_THRESHOLD_MS) return "grossed";
    if (isBlinking) return "blink";
    return "normal";
  }

  function renderPet() {
    var opts = {
      stage: state.growthStage,
      form: state.form,
      baseColor: state.petColor,
      expression: currentExpression(),
      cosmetics: Object.values(record.appearance.cosmetics.equipped).filter(Boolean),
    };
    if (use3D) {
      var ok = PetRender3D.renderToCanvas(petCanvas, opts);
      if (!ok) { // WebGL died after all — fall back for the rest of this session
        use3D = false;
        petCanvas = petCanvas2D;
        petCanvas3D.style.display = "none";
        petCanvas2D.style.display = "";
        PetRender.renderPet(petCanvas, opts);
      }
    } else {
      PetRender.renderPet(petCanvas, opts);
    }
  }

  // ============================================================
  // AUDIO — presets built on the shared PetAudio.tone()
  // ============================================================

  function sfxChomp() { PetAudio.playSample("chomp", function () { PetAudio.tone(300, 90, { type: "sine", endFreq: 500, peakGain: 0.5 }); }); }
  function sfxBounce() { PetAudio.tone(600, 60, { type: "square", peakGain: 0.3 }); }
  function sfxCombo() { [523, 659, 784].forEach(function (f, i) { PetAudio.tone(f, 100, { type: "triangle", delayMs: i * 90, peakGain: 0.4 }); }); }
  function sfxDisciplineCall() {
    PetAudio.tone(880, 90, { type: "square", peakGain: 0.35 });
    PetAudio.tone(880, 90, { type: "square", delayMs: 160, peakGain: 0.35 });
  }
  function sfxDisciplineResolved() { PetAudio.playSample("discipline", function () { PetAudio.tone(988, 130, { type: "triangle", peakGain: 0.4 }); }); }
  function sfxPoopAppear() { PetAudio.tone(220, 80, { type: "sine", endFreq: 140, peakGain: 0.3 }); }
  function sfxPoopCleaned() { PetAudio.playSample("clean", function () { PetAudio.tone(700, 90, { type: "triangle", endFreq: 900, peakGain: 0.35 }); }); }
  function sfxBedtimeCall() { PetAudio.tone(300, 500, { type: "sine", endFreq: 200, peakGain: 0.3 }); }
  function sfxBedtimeResolved() {
    PetAudio.playSample("bedtime", function () {
      [440, 523, 659].forEach(function (f, i) { PetAudio.tone(f, 220, { type: "sine", delayMs: i * 150, peakGain: 0.3 }); });
    });
  }
  function sfxMilestone() {
    PetAudio.playSample("win", function () {
      [523, 659, 784, 1046, 1318].forEach(function (f, i) { PetAudio.tone(f, 180, { type: "triangle", delayMs: i * 110, peakGain: 0.5 }); });
    });
  }

  // ============================================================
  // SCREEN MANAGEMENT
  // ============================================================

  var screens = {
    hatching: document.getElementById("screen-hatching"),
    play: document.getElementById("screen-play"),
  };

  function showScreen(name) {
    Object.keys(screens).forEach(function (k) { screens[k].classList.remove("active"); });
    screens[name].classList.add("active");
  }

  // ============================================================
  // DOM REFS
  // ============================================================

  var petWrap = document.getElementById("pet-canvas-wrap");
  var petStageArea = document.getElementById("pet-stage-area");
  var foodEl = document.getElementById("food-item");
  var foodCanvas = document.getElementById("food-canvas");
  var spongeEl = document.getElementById("sponge-item");
  var spongeCanvas = document.getElementById("sponge-canvas");
  var callFlashEl = document.getElementById("call-flash");
  var comboPopEl = document.getElementById("combo-pop");
  var approvePopEl = document.getElementById("approve-pop");
  var pointsFlashEl = document.getElementById("points-flash");
  var milestonePopEl = document.getElementById("milestone-pop");
  var pipsHunger = document.getElementById("pips-hunger");
  var pipsHappy = document.getElementById("pips-happy");
  var disciplineTag = document.getElementById("discipline-tag");
  var weightTag = document.getElementById("weight-tag");
  var pointsTag = document.getElementById("points-tag");
  var muteBtn = document.getElementById("mute-btn");
  var plazaBtn = document.getElementById("plaza-btn");
  var bedtimePrompt = document.getElementById("bedtime-prompt");
  var nightDim = document.getElementById("night-dim");
  var beatContinueEl = document.getElementById("beat-continue");
  var beatContinueText = document.getElementById("beat-continue-text");
  var eggCanvasHatch = document.getElementById("egg-canvas-hatch");
  var hatchCrackView = document.getElementById("hatching-crack-view");
  var petNameLabel = document.getElementById("pet-name-label");
  var shell = document.getElementById("shell");

  function applyFrame(frameId) {
    var frame = FRAME_THEMES.find(function (f) { return f.id === frameId; }) || FRAME_THEMES[0];
    shell.dataset.frame = frame.id;
  }
  applyFrame(state.frameId);
  petNameLabel.textContent = state.petName || "MYSTERY PET";

  function drawEgg(canvas) {
    var ctx = PetRender.clearCanvas(canvas);
    ctx.fillStyle = "#4A2E55";
    ctx.beginPath();
    ctx.ellipse(canvas.width / 2, canvas.height / 2, canvas.width * 0.42, canvas.height * 0.46, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.ellipse(canvas.width / 2, canvas.height / 2, canvas.width * 0.36, canvas.height * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#EAFBFF";
    ctx.beginPath();
    ctx.ellipse(canvas.width * 0.38, canvas.height * 0.36, canvas.width * 0.1, canvas.height * 0.07, -0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // ============================================================
  // INTERACTION LIFECYCLE
  // ============================================================

  var foodSpawnPos = null;
  var spongeSpawnPos = null;
  var feedTypesEaten = [];

  function placeInstantly(el, left, top) {
    el.style.transition = "none";
    el.style.left = left + "px";
    el.style.top = top + "px";
    void el.offsetWidth;
    el.style.transition = "";
  }

  function positionFoodAtSpawn() {
    var rect = petStageArea.getBoundingClientRect();
    foodSpawnPos = { left: rect.width / 2 - 22, top: rect.height - 66 };
    placeInstantly(foodEl, foodSpawnPos.left, foodSpawnPos.top);
  }

  function positionSpongeAtSpawn() {
    var rect = petStageArea.getBoundingClientRect();
    spongeSpawnPos = { left: rect.width * 0.72, top: rect.height * 0.18 };
    placeInstantly(spongeEl, spongeSpawnPos.left, spongeSpawnPos.top);
  }

  function nextFoodType() {
    if (state.beat === "feed" && feedTypesEaten.length === 1) {
      return feedTypesEaten[0] === "meal" ? "snack" : "meal";
    }
    return Math.random() < 0.65 ? "meal" : "snack";
  }

  function refreshFoodSlot() {
    state.foodSlot.type = nextFoodType();
    drawIcon(foodCanvas, state.foodSlot.type);
  }

  function applyDeltas(deltas) {
    for (var k in deltas) {
      state.stats[k] = clamp(state.stats[k] + deltas[k], 0, 100);
    }
  }

  function renderMeters() {
    [["hunger", pipsHunger], ["happy", pipsHappy]].forEach(function (pair) {
      var key = pair[0], container = pair[1];
      var filled = clamp(Math.round(state.stats[key] / 20), 0, 5);
      container.innerHTML = "";
      for (var i = 0; i < 5; i++) {
        var c = document.createElement("canvas");
        c.width = 16; c.height = 14;
        drawIcon(c, i < filled ? "heartFilled" : "heartEmpty");
        container.appendChild(c);
      }
    });
  }

  function renderHudTags() {
    disciplineTag.textContent = "DISC " + Math.round(state.stats.discipline);
    weightTag.textContent = "WEIGHT: " + (state.stats.weight > 75 ? "a bit much" : "healthy");
    pointsTag.textContent = record.points.balance + " PTS";
  }

  function popText(el, text) {
    el.textContent = text;
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  }

  // called once at the end of every interaction round — awards points into
  // the shared save (replacing the old one-shot computeCareScore/evaluateForm
  // at Reveal), advances growth stage from cumulative visit count, and pops a
  // milestone toast + records a leaderboard entry whenever growth/form changes
  function completeInteraction(location, points, careDelta, reason) {
    var prevStage = state.growthStage;
    var prevForm = state.form;

    record = PetSave.awardPoints(activeKey, points, { location: location, reason: reason, careDelta: careDelta });
    state.form = record.appearance.form;

    var visits = record.visits.home;
    if (visits >= STAGE_FORM_AT_VISITS) state.growthStage = "form";
    else if (visits >= STAGE_CHILD_AT_VISITS) state.growthStage = "child";
    // awardPoints() loads a fresh record from storage, so `record.stats` is
    // now a different object than `state.stats` — persist() re-syncs it from
    // the live in-memory state before saving, or this round's hunger/happy/
    // discipline/weight changes would be silently overwritten with stale data
    persist();

    popText(pointsFlashEl, "+" + points + " PTS");

    if (state.growthStage !== prevStage || (state.growthStage === "form" && state.form !== prevForm)) {
      sfxMilestone();
      var label = state.growthStage === "form" ? (state.form || "").toUpperCase() : state.growthStage.toUpperCase();
      popText(milestonePopEl, "GREW UP!\n" + label);
      milestonePopEl.classList.add("show");
      PetSave.recordLeaderboardEntry(activeKey, {
        score: record.points.balance,
        verdict: "reached " + label,
      });
    }

    renderHudTags();
    renderMeters();
    renderPet();
  }

  // ============================================================
  // ATTENTION — scold to resolve
  // ============================================================

  function startAttentionBeat() {
    state.events.callActive = true;
    state.events.callDeadline = performance.now() + CALL_WINDOW_MS;
    callFlashEl.classList.add("show");
    sfxDisciplineCall();
  }

  function checkAttentionCallTimeout(now) {
    if (state.events.callActive && now >= state.events.callDeadline) {
      state.events.callActive = false;
      callFlashEl.classList.remove("show");
      completeInteraction("home", 5, 0.3, "attention: missed");
      advanceBeat();
    }
  }

  function resolveDisciplineCall() {
    state.stats.discipline = clamp(state.stats.discipline + DISCIPLINE_GAIN, 0, 100);
    state.events.callActive = false;
    callFlashEl.classList.remove("show");
    sfxDisciplineResolved();
    popText(approvePopEl, "+DISC");
    completeInteraction("home", 15, 1, "attention: resolved");
    advanceBeat();
  }

  // ============================================================
  // CLEAN — sponge the mess away
  // ============================================================

  function startCleanBeat() {
    state.poopPresent = true;
    state.poopSpawnedAt = performance.now();
    positionSpongeAtSpawn();
    spongeEl.style.display = "";
    spongeEl.classList.remove("cleaned");
    sfxPoopAppear();
  }

  function cleanPoop() {
    if (state.beat !== "clean") return;
    var timely = (performance.now() - state.poopSpawnedAt) < POOP_UNCLEANED_HAPPY_THRESHOLD_MS;
    state.poopPresent = false;
    applyDeltas({ happy: timely ? 3 : 1 });
    sfxPoopCleaned();
    spongeEl.classList.add("cleaned");
    setTimeout(function () {
      spongeEl.style.display = "none";
      spongeEl.classList.remove("cleaned");
      positionSpongeAtSpawn();
    }, 250);
    completeInteraction("home", timely ? 15 : 8, timely ? 1 : 0.6, "cleaned up");
    advanceBeat();
  }

  // ============================================================
  // BEDTIME
  // ============================================================

  function triggerBedtime() {
    state.events.bedtimeActive = true;
    state.events.bedtimeHandled = false;
    state.events.bedtimeDeadline = performance.now() + CALL_WINDOW_MS;
    bedtimePrompt.classList.add("show");
    petExpression = "sleepy";
    sfxBedtimeCall();
  }

  function checkBedtimeTimeout(now) {
    if (state.events.bedtimeActive && !state.events.bedtimeHandled && now >= state.events.bedtimeDeadline) {
      state.events.bedtimeHandled = true;
      state.events.bedtimeActive = false;
      bedtimePrompt.classList.remove("show");
      petExpression = "normal";
      applyDeltas({ happy: -8 });
      completeInteraction("home", 5, 0.3, "bedtime: missed");
      advanceBeat();
    }
  }

  function beginSleepResponse() {
    petExpression = "sleepy";
  }

  function endSleepResponse() {
    if (state.events.bedtimeActive && !state.events.bedtimeHandled) {
      state.events.bedtimeHandled = true;
      state.events.bedtimeActive = false;
      bedtimePrompt.classList.remove("show");
      applyDeltas({ happy: 5 });
      state.stats.discipline = clamp(state.stats.discipline + 5, 0, 100);
      sfxBedtimeResolved();
      nightDim.classList.add("show");
      setTimeout(function () { nightDim.classList.remove("show"); }, 3000);
      completeInteraction("home", 15, 1, "bedtime: caught");
      advanceBeat();
    }
    petExpression = "normal";
  }

  // ============================================================
  // INTERACTION CONTROLLER — cycles the fixed sequence forever
  // ============================================================

  function enterBeat(name) {
    state.beat = name;
    foodEl.style.display = "none";
    spongeEl.style.display = "none";
    beatContinueEl.style.display = "none";
    switch (name) {
      case "feed":
        feedTypesEaten = [];
        refreshFoodSlot();
        positionFoodAtSpawn();
        foodEl.style.display = "";
        beatContinueText.textContent = "TAP TO CONTINUE";
        beatContinueEl.style.display = "";
        break;
      case "clean":
        startCleanBeat();
        break;
      case "attention":
        startAttentionBeat();
        break;
      case "bedtime":
        triggerBedtime();
        break;
    }
  }

  function advanceBeat() {
    var next = INTERACTION_SEQUENCE[(INTERACTION_SEQUENCE.indexOf(state.beat) + 1) % INTERACTION_SEQUENCE.length];
    enterBeat(next);
  }

  beatContinueEl.addEventListener("pointerdown", function () {
    if (state.beat !== "feed") return;
    var quality = feedTypesEaten.length / 2; // 0, 0.5, or 1
    completeInteraction("home", Math.round(quality * 20), quality, "fed");
    advanceBeat();
  });

  persist();

  // ============================================================
  // INPUT HANDLING — pet tap / hold / scold
  // ============================================================

  function squishPet() {
    petCanvas.classList.remove("pet-squish");
    void petCanvas.offsetWidth;
    petCanvas.classList.add("pet-squish");
  }

  function registerPlayTap() {
    sfxBounce();
    applyDeltas({ happy: TAP_HAPPY_DELTA });
    renderMeters();

    var now = performance.now();
    state.input.tapTimestamps.push(now);
    state.input.tapTimestamps = state.input.tapTimestamps.filter(function (t) { return now - t <= COMBO_WINDOW_MS; });
    if (state.input.tapTimestamps.length >= COMBO_TAP_COUNT) {
      applyDeltas({ happy: COMBO_HAPPY_BONUS });
      renderMeters();
      sfxCombo();
      popText(comboPopEl, "COMBO!");
      state.input.tapTimestamps = [];
    }
  }

  function beginPetPress() {
    if (state.input.draggingItemId) return;
    state.input.pressStart = performance.now();
    state.input.holding = false;
    if (!state.events.bedtimeActive) petExpression = "pressed";
    squishPet();
    renderPet();
  }

  petWrap.addEventListener("pointerdown", function (e) {
    if (state.input.draggingItemId) return;
    PetAudio.ensureContext();
    e.preventDefault();
    petWrap.setPointerCapture(e.pointerId);
    beginPetPress();
  });

  function releasePetPress() {
    if (state.events.callActive) {
      resolveDisciplineCall();
    } else if (state.input.holding) {
      if (state.events.bedtimeActive) endSleepResponse();
    } else if (state.input.pressStart !== null) {
      registerPlayTap();
    }
    state.input.pressStart = null;
    state.input.holding = false;
    if (petExpression === "pressed") petExpression = "normal";
    renderPet();
  }

  petWrap.addEventListener("pointerup", function () { releasePetPress(); });

  petWrap.addEventListener("pointercancel", function () {
    state.input.pressStart = null;
    state.input.holding = false;
    petExpression = "normal";
  });

  // ============================================================
  // INPUT HANDLING — drag (food, sponge)
  // ============================================================

  var dragOffset = { x: 0, y: 0 };

  function mouthZoneCenter() {
    var rect = petWrap.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height * 0.62, radius: rect.width * 0.16 };
  }

  function petCleanZoneCenter() {
    var rect = petWrap.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, radius: rect.width * 0.55 };
  }

  function snapFoodBack() {
    foodEl.style.left = foodSpawnPos.left + "px";
    foodEl.style.top = foodSpawnPos.top + "px";
  }

  function snapSpongeBack() {
    spongeEl.style.left = spongeSpawnPos.left + "px";
    spongeEl.style.top = spongeSpawnPos.top + "px";
  }

  function resolveFoodEaten() {
    if (state.beat !== "feed") return;
    var type = state.foodSlot.type;
    sfxChomp();
    if (type === "meal") {
      applyDeltas({ hunger: MEAL_HUNGER, happy: MEAL_HAPPY });
    } else if (type === "snack") {
      applyDeltas({ hunger: SNACK_HUNGER, happy: SNACK_HAPPY });
      state.stats.weight = clamp(state.stats.weight + SNACK_WEIGHT, 0, 100);
      renderHudTags();
    }
    renderMeters();
    foodEl.classList.add("eaten");

    if (state.beat === "feed" && feedTypesEaten.indexOf(type) === -1) {
      feedTypesEaten.push(type);
    }

    setTimeout(function () {
      foodEl.classList.remove("eaten");
      if (state.beat === "feed" && feedTypesEaten.length >= 2) {
        completeInteraction("home", 20, 1, "fed both");
        advanceBeat();
      } else {
        refreshFoodSlot();
        positionFoodAtSpawn();
      }
    }, FOOD_RESPAWN_MS);
  }

  foodEl.addEventListener("pointerdown", function (e) {
    PetAudio.ensureContext();
    e.preventDefault();
    foodEl.setPointerCapture(e.pointerId);
    state.input.draggingItemId = foodEl.id;
    foodEl.classList.add("dragging");
    var rect = foodEl.getBoundingClientRect();
    dragOffset.x = e.clientX - (rect.left + rect.width / 2);
    dragOffset.y = e.clientY - (rect.top + rect.height / 2);
  });

  foodEl.addEventListener("pointermove", function (e) {
    if (state.input.draggingItemId !== foodEl.id) return;
    var stageRect = petStageArea.getBoundingClientRect();
    var x = e.clientX - dragOffset.x - stageRect.left;
    var y = e.clientY - dragOffset.y - stageRect.top;
    foodEl.style.left = x + "px";
    foodEl.style.top = y + "px";
  });

  foodEl.addEventListener("pointerup", function () {
    if (state.input.draggingItemId !== foodEl.id) return;
    state.input.draggingItemId = null;
    foodEl.classList.remove("dragging");
    var foodRect = foodEl.getBoundingClientRect();
    var foodCenter = { x: foodRect.left + foodRect.width / 2, y: foodRect.top + foodRect.height / 2 };
    var mouth = mouthZoneCenter();
    var dist = Math.hypot(foodCenter.x - mouth.x, foodCenter.y - mouth.y);
    if (dist <= mouth.radius + 14) resolveFoodEaten(); else snapFoodBack();
  });

  foodEl.addEventListener("pointercancel", function () {
    state.input.draggingItemId = null;
    foodEl.classList.remove("dragging");
    snapFoodBack();
  });

  spongeEl.addEventListener("pointerdown", function (e) {
    PetAudio.ensureContext();
    e.preventDefault();
    spongeEl.setPointerCapture(e.pointerId);
    state.input.draggingItemId = spongeEl.id;
    spongeEl.classList.add("dragging");
    var rect = spongeEl.getBoundingClientRect();
    dragOffset.x = e.clientX - (rect.left + rect.width / 2);
    dragOffset.y = e.clientY - (rect.top + rect.height / 2);
  });

  spongeEl.addEventListener("pointermove", function (e) {
    if (state.input.draggingItemId !== spongeEl.id) return;
    var stageRect = petStageArea.getBoundingClientRect();
    var x = e.clientX - dragOffset.x - stageRect.left;
    var y = e.clientY - dragOffset.y - stageRect.top;
    spongeEl.style.left = x + "px";
    spongeEl.style.top = y + "px";

    if (state.poopPresent) {
      var spongeRect = spongeEl.getBoundingClientRect();
      var spongeCenter = { x: spongeRect.left + spongeRect.width / 2, y: spongeRect.top + spongeRect.height / 2 };
      var zone = petCleanZoneCenter();
      var dist = Math.hypot(spongeCenter.x - zone.x, spongeCenter.y - zone.y);
      if (dist <= zone.radius) {
        state.input.draggingItemId = null;
        spongeEl.classList.remove("dragging");
        cleanPoop();
      }
    }
  });

  spongeEl.addEventListener("pointerup", function () {
    if (state.input.draggingItemId !== spongeEl.id) return;
    state.input.draggingItemId = null;
    spongeEl.classList.remove("dragging");
    snapSpongeBack();
  });

  spongeEl.addEventListener("pointercancel", function () {
    if (state.input.draggingItemId !== spongeEl.id) return;
    state.input.draggingItemId = null;
    spongeEl.classList.remove("dragging");
    snapSpongeBack();
  });

  // ============================================================
  // HAND TRACKING — optional additive input layer (webcam gestures)
  //
  // Touch stays the default, reliable input; this only ever runs after the
  // player opts in, and any failure (no camera, no internet, model load
  // error) just leaves hand tracking off — it never blocks or degrades the
  // touch game. Gestures call the exact same action functions touch uses.
  // ============================================================

  var HAND_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  var HAND_VISION_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  var PINCH_RATIO_THRESHOLD = 0.62;
  var FINGER_EXTENDED_RATIO = 1.15;
  var OPEN_PALM_MIN_FINGERS = 3;
  var GESTURE_COOLDOWN_MS = 500;
  var PINCH_COOLDOWN_MS = 700;
  var WIPE_COOLDOWN_MS = 500;
  var OPEN_PRESS_MIN_DWELL_MS = 120;
  var STROKE_MIN_PATH = 0.035;
  var WIPE_VX_THRESHOLD = 2.4;
  var HAND_HISTORY_WINDOW_MS = 400;

  var handTrack = {
    enabled: false, loading: false, video: null, stream: null, landmarker: null,
    lastVideoTs: -1, history: [], wasPinching: false, wasFist: false, wasPointing: false,
    pressEngaged: false, openDwellStart: null,
    lastGestureAt: { feed: 0, play: 0, scold: 0, clean: 0 },
  };

  var handtrackBtn = document.getElementById("handtrack-btn");
  var handtrackStatus = document.getElementById("handtrack-status");
  var handtrackPreview = document.getElementById("handtrack-preview");
  var handtrackOverlay = document.getElementById("handtrack-overlay");
  var handtrackLabel = document.getElementById("handtrack-label");

  function setHandTrackStatus(text) { handtrackStatus.textContent = text; }
  function setGestureLabel(text) { if (handtrackLabel.textContent !== text) handtrackLabel.textContent = text; }

  function classifyHandGesture(landmarks) {
    var wrist = landmarks[0];
    var dist2 = function (a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };
    var scale = Math.max(dist2(landmarks[0], landmarks[9]), 0.001);

    var fingerJoints = { index: [6, 8], middle: [10, 12], ring: [14, 16], pinky: [18, 20] };
    var extended = {};
    Object.keys(fingerJoints).forEach(function (name) {
      var pip = fingerJoints[name][0], tip = fingerJoints[name][1];
      extended[name] = dist2(wrist, landmarks[tip]) > dist2(wrist, landmarks[pip]) * FINGER_EXTENDED_RATIO;
    });
    var opennessCount = Object.values(extended).filter(Boolean).length;

    var pinchRatio = dist2(landmarks[4], landmarks[8]) / scale;

    var palm = {
      x: (landmarks[0].x + landmarks[5].x + landmarks[9].x + landmarks[13].x + landmarks[17].x) / 5,
      y: (landmarks[0].y + landmarks[5].y + landmarks[9].y + landmarks[13].y + landmarks[17].y) / 5,
    };

    return {
      palm: palm,
      opennessCount: opennessCount,
      isPinching: pinchRatio < PINCH_RATIO_THRESHOLD,
      isFist: opennessCount === 0,
      isOpenPalm: opennessCount >= OPEN_PALM_MIN_FINGERS,
      isPointing: extended.index && !extended.middle && !extended.ring && !extended.pinky,
    };
  }

  function endGesturePressIfActive() {
    if (!handTrack.pressEngaged) return;
    handTrack.pressEngaged = false;
    handTrack.openDwellStart = null;
    releasePetPress();
  }

  function onHandResult(landmarks, nowMs) {
    if (!landmarks) {
      handTrack.history = [];
      handTrack.wasPinching = false;
      handTrack.wasFist = false;
      handTrack.wasPointing = false;
      endGesturePressIfActive();
      setGestureLabel("");
      return;
    }

    var g = classifyHandGesture(landmarks);
    handTrack.history.push({ t: nowMs, x: g.palm.x, y: g.palm.y });
    handTrack.history = handTrack.history.filter(function (s) { return nowMs - s.t <= HAND_HISTORY_WINDOW_MS; });

    var vx = 0, pathLen = 0;
    if (handTrack.history.length >= 2) {
      var first = handTrack.history[0];
      var last = handTrack.history[handTrack.history.length - 1];
      var dt = Math.max((last.t - first.t) / 1000, 0.001);
      vx = (last.x - first.x) / dt;
      for (var i = 1; i < handTrack.history.length; i++) {
        pathLen += Math.hypot(
          handTrack.history[i].x - handTrack.history[i - 1].x,
          handTrack.history[i].y - handTrack.history[i - 1].y
        );
      }
    }

    var label = "";

    if (g.isPinching && !handTrack.wasPinching && !state.input.draggingItemId &&
        nowMs - handTrack.lastGestureAt.feed > PINCH_COOLDOWN_MS) {
      resolveFoodEaten();
      handTrack.lastGestureAt.feed = nowMs;
      label = "FEED";
    }

    if (!label && g.isFist && !handTrack.wasFist && !handTrack.pressEngaged &&
        nowMs - handTrack.lastGestureAt.play > GESTURE_COOLDOWN_MS) {
      registerPlayTap();
      handTrack.lastGestureAt.play = nowMs;
      label = "PLAY";
    }

    if (!label && g.isPointing && !handTrack.wasPointing && state.events.callActive &&
        nowMs - handTrack.lastGestureAt.scold > GESTURE_COOLDOWN_MS) {
      resolveDisciplineCall();
      handTrack.lastGestureAt.scold = nowMs;
      label = "SCOLD";
    }

    if (!label && state.poopPresent && g.opennessCount >= 2 && Math.abs(vx) > WIPE_VX_THRESHOLD &&
        nowMs - handTrack.lastGestureAt.clean > WIPE_COOLDOWN_MS) {
      cleanPoop();
      handTrack.lastGestureAt.clean = nowMs;
      label = "CLEAN";
    }

    if (g.isOpenPalm) {
      if (handTrack.openDwellStart === null) handTrack.openDwellStart = nowMs;
      if (!handTrack.pressEngaged &&
          nowMs - handTrack.openDwellStart >= OPEN_PRESS_MIN_DWELL_MS &&
          pathLen >= STROKE_MIN_PATH) {
        handTrack.pressEngaged = true;
        beginPetPress();
      }
      if (handTrack.pressEngaged && !label) label = "PET";
    } else {
      handTrack.openDwellStart = null;
      endGesturePressIfActive();
    }

    handTrack.wasPinching = g.isPinching;
    handTrack.wasFist = g.isFist;
    handTrack.wasPointing = g.isPointing;
    setGestureLabel(label);
  }

  function drawHandOverlay(landmarks) {
    var ctx = handtrackOverlay.getContext("2d");
    ctx.clearRect(0, 0, handtrackOverlay.width, handtrackOverlay.height);
    if (!landmarks) return;
    ctx.fillStyle = "#FF6FB5";
    landmarks.forEach(function (lm) {
      ctx.beginPath();
      ctx.arc(lm.x * handtrackOverlay.width, lm.y * handtrackOverlay.height, 2, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function handTrackLoop() {
    if (!handTrack.enabled) return;
    var video = handTrack.video;
    if (video && video.readyState >= 2 && video.currentTime !== handTrack.lastVideoTs) {
      handTrack.lastVideoTs = video.currentTime;
      var nowMs = performance.now();
      var landmarks = null;
      try {
        var result = handTrack.landmarker.detectForVideo(video, nowMs);
        landmarks = result && result.landmarks && result.landmarks[0] ? result.landmarks[0] : null;
      } catch (err) { /* a stray detection failure shouldn't kill the loop */ }
      drawHandOverlay(landmarks);
      onHandResult(landmarks, nowMs);
    }
    requestAnimationFrame(handTrackLoop);
  }

  function enableHandTracking() {
    if (handTrack.loading || handTrack.enabled) return;
    handTrack.loading = true;
    setHandTrackStatus("starting camera...");
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 }, audio: false })
      .then(function (stream) {
        var video = document.getElementById("handtrack-video");
        video.srcObject = stream;
        return video.play().then(function () {
          setHandTrackStatus("loading hand model...");
          return import(HAND_VISION_BASE + "/vision_bundle.mjs").then(function (visionModule) {
            return visionModule.FilesetResolver.forVisionTasks(HAND_VISION_BASE + "/wasm").then(function (filesetResolver) {
              return visionModule.HandLandmarker.createFromOptions(filesetResolver, {
                baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "GPU" },
                runningMode: "VIDEO", numHands: 1,
              }).catch(function () {
                return visionModule.HandLandmarker.createFromOptions(filesetResolver, {
                  baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "CPU" },
                  runningMode: "VIDEO", numHands: 1,
                });
              });
            });
          }).then(function (landmarker) {
            stream.getTracks().forEach(function (track) { track.onended = disableHandTracking; });
            handTrack.stream = stream;
            handTrack.video = video;
            handTrack.landmarker = landmarker;
            handTrack.enabled = true;
            handTrack.loading = false;
            handtrackPreview.style.display = "";
            handtrackBtn.textContent = "🖐 HAND TRACKING: ON";
            setHandTrackStatus("pinch=feed · palm=pet · fist=play · point=scold · swipe=clean");
            requestAnimationFrame(handTrackLoop);
          });
        });
      })
      .catch(function (err) {
        handTrack.loading = false;
        handTrack.enabled = false;
        setHandTrackStatus("unavailable (needs camera + internet)");
        console.warn("Hand tracking unavailable:", err);
      });
  }

  function disableHandTracking() {
    handTrack.enabled = false;
    handTrack.loading = false;
    endGesturePressIfActive();
    if (handTrack.stream) handTrack.stream.getTracks().forEach(function (t) { t.onended = null; t.stop(); });
    handTrack.stream = null;
    handTrack.landmarker = null;
    handtrackPreview.style.display = "none";
    handtrackBtn.textContent = "🖐 HAND TRACKING";
    setHandTrackStatus("");
    setGestureLabel("");
  }

  handtrackBtn.addEventListener("click", function () {
    PetAudio.ensureContext();
    if (handTrack.enabled) disableHandTracking(); else enableHandTracking();
  });

  handtrackPreview.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    disableHandTracking();
  });

  // ============================================================
  // GAME LOOP
  // ============================================================

  function tickBeat(now) {
    if (state.beat === "attention") checkAttentionCallTimeout(now);
    if (state.beat === "bedtime") checkBedtimeTimeout(now);
  }

  function frame() {
    var now = performance.now();
    if (state.beat === "clean" && state.poopPresent && (now - state.poopSpawnedAt) >= POOP_UNCLEANED_HAPPY_THRESHOLD_MS) {
      applyDeltas({ happy: -POOP_HAPPY_DRAIN_PER_SEC * 0.016 });
      renderMeters();
    }
    if (state.input.pressStart !== null && !state.input.holding) {
      if (now - state.input.pressStart >= HOLD_THRESHOLD_MS) {
        state.input.holding = true;
        if (state.events.bedtimeActive) beginSleepResponse();
      }
    }
    tickBeat(now);
    renderPet();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ============================================================
  // UI WIRING
  // ============================================================

  muteBtn.addEventListener("click", function () {
    var next = !PetAudio.isMuted();
    PetAudio.ensureContext();
    PetAudio.setMuted(next);
    muteBtn.textContent = next ? "M" : "S";
    muteBtn.setAttribute("aria-pressed", String(next));
  });

  plazaBtn.addEventListener("click", function () {
    persist();
    location.href = "index.html";
  });

  // ============================================================
  // INIT
  // ============================================================

  drawIcon(spongeCanvas, "sponge");
  positionFoodAtSpawn();
  positionSpongeAtSpawn();
  renderMeters();
  renderHudTags();
  renderPet();

  var isFirstVisit = record.visits.home === 0;
  if (isFirstVisit) {
    showScreen("hatching");
    var eggWrap = hatchCrackView.querySelector(".egg-canvas-wrap");
    drawEgg(eggCanvasHatch);
    setTimeout(function () { eggWrap.classList.add("egg-flash"); }, 900);
    setTimeout(function () {
      showScreen("play");
      enterBeat(INTERACTION_SEQUENCE[0]);
    }, 1500);
  } else {
    showScreen("play");
    enterBeat(INTERACTION_SEQUENCE[0]);
  }
})();
</script>
</body>
</html>
